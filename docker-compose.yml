services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: solaruser
      POSTGRES_PASSWORD: solarpassword
      POSTGRES_DB: solardb
    ports:
      - "5434:5432"
    volumes:
      - solarpro-pg-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

volumes:
  solarpro-pg-data:

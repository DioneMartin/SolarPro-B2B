name: CI

on:
  push:
    branches: [develop, main, 'feature/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend — Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: solaruser
          POSTGRES_PASSWORD: solarpassword
          POSTGRES_DB: solardb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Prepare .env
        run: |
          cp .env.example .env
          echo "DB_PORT=5432" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "JWT_SECRET=ci-test-secret-do-not-use-in-production" >> .env
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend
        continue-on-error: true

      - name: Unit tests
        run: npm test -- --passWithNoTests
        working-directory: backend

      - name: E2E tests
        run: npm run test:e2e
        working-directory: backend

  frontend-build:
    name: Frontend — Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend
        continue-on-error: true

      - name: Build
        run: npm run build
        working-directory: frontend
